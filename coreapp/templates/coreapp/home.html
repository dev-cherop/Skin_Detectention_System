<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skin Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
        color: #fff;
      }

      /* Background with gradient + medical image overlay */
      .hero {
        min-height: 100vh;
        background: linear-gradient(rgba(13,110,253,0.85), rgba(33,37,41,0.9)),
          url("https://images.unsplash.com/photo-1580281658629-18b1a6b3a1e3?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80") center/cover no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
      }

      .hero h1 {
        font-size: 3rem;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .hero p {
        font-size: 1.2rem;
        margin-bottom: 30px;
      }

      .btn-custom {
        padding: 12px 30px;
        font-size: 1.1rem;
        border-radius: 30px;
        background-color: #0dcaf0;
        border: none;
        transition: 0.3s ease;
      }

      .btn-custom:hover {
        background-color: #0bb3d9;
        transform: scale(1.05);
      }

      .info-box {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50px;
        padding: 40px;
        margin-top: 30px;
        margin-left: 33%;
        backdrop-filter: blur(6px);
        width: 400px;
      }

      .info-box h5 {
        color: #0dcaf0;
      }
    </style>
  </head>
  <body>
    
    <!-- Hero Section -->
    <div class="hero">
      <div class="container">
        <h1>Skin Detection System</h1>
        <p>
          AI-powered assistance for early detection of 
          <strong>Melanoma</strong>, <strong>Basal Cell Carcinoma</strong>, 
          and <strong>Squamous Cell Carcinoma</strong>.
        </p>
        <a href="{% url 'signup' %}" class="btn btn-custom shadow">Get Started</a>
        
        <!-- Info Box -->
        <div class="info-box mt-4">
          <h5>Why Choose Us?</h5>
          <ul class="list-unstyled">
            <li>✔ Reliable AI analysis for skin conditions</li>
            <li>✔ Early detection saves lives</li>
            <li>✔ Built for patients and healthcare providers</li>
          </ul>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
