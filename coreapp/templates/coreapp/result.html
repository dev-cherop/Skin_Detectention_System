{% load static %}
<html>

<head>
    <meta charset="UTF-8">
    <title>Skin Cancer Result</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css">
    <!-- Bootstrap core CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <!-- Material Design Bootstrap -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdbootstrap/4.10.0/css/mdb.min.css" rel="stylesheet">

    <style>
        html, body {
            
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
                        url("{% static 'retina.jpg' %}") center/cover no-repeat;
        }

        .container {
            margin-top: 20px;
            height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            margin-top: 30px;
            width: 800px;
            max-width: 90%;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 20px;
        }

        .badge {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            background-color: #0d6efd;
            color: #fff;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        h2, h3 {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        #result-image {
            display: block;
            margin: 10px auto;
            max-width: 100%;
            max-height: 200px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .back-btn {
            display: inline-block;
            text-align: center;
            margin: 15px auto 0;
            padding: 7px 15px;
            background-color: #0d6efd;
            color: #fff;
            font-weight: 600;
            border-radius: 10px;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.2s;
        }

        .back-btn:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
        }

        /* Navbar minimized for single-page view */
        .navbar {
            background-color: rgba(13,110,253,0.9) !important;
            margin-bottom: 0;
        }
        .navbar .navbar-brand,
        .navbar .nav-link { color: #fff !important; font-weight: 600; }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <a class="navbar-brand" href="#">SKIN CANCER</a>
        <div class="ml-auto navbar-nav">
            <span class="nav-link"><i class="fas fa-user"></i> {{name}}</span>
            <a class="nav-link" href="{% url 'logout' %}"><i class="fas fa-sign-out-alt"></i></a>
        </div>
    </nav>

    <div class="container">
        <div class="card hoverable">
            <span class="badge">RESULT</span>
            <div class="text-center">
                <h2>{{result}}</h2>
                <h3>{{description}}</h3>

                <h3>Your input image:</h3>
                <img id="result-image" src="{% static 'img/result.jpg' %}" alt="Result Image">

                <a href="{% url 'dashboard' %}" class="back-btn">
                    <i class="far fa-arrow-alt-circle-left"></i> Back
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.4/umd/popper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdbootstrap/4.10.0/js/mdb.min.js"></script>
</body>

</html>
